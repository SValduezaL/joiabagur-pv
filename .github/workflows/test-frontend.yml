name: Frontend Tests

# BRANCHES CORRECTED BY C39a. Same defect and same reasoning as
# `test-backend.yml`: the trigger named `[main, develop]`, neither branch exists,
# and this workflow had therefore never executed once.
#
# INFORMATIVE AND NOT A GATE. The frontend suite is red before anyone touches it —
# 113 of 729 across 14 of 54 files, measured at the head of C40 — and the set of
# failing names ROTATES between runs of the same commit, over at least three files.
# `vitest` also exits 0 when piped, so a green prompt says nothing: the summary line
# is what counts.
#
# The `paths` filter stays, for the asymmetry explained in the backend workflow.
on:
  push:
    branches: [ai-eng, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    branches: [ai-eng, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linting
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: frontend/test-results
          retention-days: 7
