name: Backend Tests

# BRANCHES CORRECTED BY C39a, AND THE OLD ONES DID NOT EXIST.
#
# This workflow triggered on `[main, develop]` and **neither branch exists in this
# repository**: the real ones are `master`, `ai-eng` — where the whole AI final
# project is integrated — and `demo`. So it was well formed, visible, and INERT:
# `gh run list` showed it had never executed, not once. Every change of this project
# was integrated without an automated check while a workflow file suggested
# otherwise, which is worse than having no workflow at all.
#
# It is INFORMATIVE AND NOT A GATE, deliberately. The suite carries ~50 pre-existing
# failures of ~1400 (50 measured on 2026-09-27; 50 and 51 on the same commit
# earlier), and a handful are genuinely order-dependent, so two runs of identical
# code disagree. A required check over that is not a gate, it is a permanent block
# somebody will end up bypassing. Turning the suite green is its own change.
#
# The `paths` filter STAYS, unlike in the deployment workflows, and the asymmetry is
# on purpose: a test that runs unnecessarily costs minutes, while a deployment that
# fails to run leaves an environment serving old code in silence. The two filters
# fail towards opposite sides.
#
# If this is ever made a required check, mind the trap: a workflow SKIPPED by a path
# filter never reports a status, and a required check that never reports leaves a
# pull request blocked forever. It needs a companion job that always runs and
# publishes the same check name.
on:
  push:
    branches: [ai-eng, master]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'
  pull_request:
    branches: [ai-eng, master]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'

defaults:
  run:
    working-directory: backend/src

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/src/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore JoiabagurPV.sln

      - name: Build solution
        run: dotnet build JoiabagurPV.sln --configuration Release --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test JoiabagurPV.sln \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./TestResults/CoverageReport" \
            -reporttypes:"Html;Cobertura;TextSummary" \
            -assemblyfilters:"-*Tests*"

      - name: Display coverage summary
        run: cat ./TestResults/CoverageReport/Summary.txt

      - name: Check coverage threshold
        run: |
          COVERAGE=$(grep -oP 'Line coverage: \K[0-9.]+' ./TestResults/CoverageReport/Summary.txt || echo "0")
          echo "Line coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "::error::Code coverage ($COVERAGE%) is below the minimum threshold of 70%"
            exit 1
          fi
          echo "✅ Coverage threshold met: $COVERAGE% >= 70%"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/src/TestResults/*.trx
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/src/TestResults/CoverageReport
          retention-days: 30

      - name: Publish test results to GitHub
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Test Results
          path: backend/src/TestResults/*.trx
          reporter: dotnet-trx
