version: '3.8'

services:
  postgres:
    # pgvector-enabled PG 15 so extension `vector` is available for C05.
    #
    # `docker compose down` keeps the data: the volume is named and survives the
    # container being stopped, removed or recreated. `docker compose down -v` does
    # destroy it. That was the recipe recommended here while the catalogue was
    # empty; it stopped being empty when the real shop catalogue was imported, so
    # `-v` now costs a re-import. If the volume genuinely has to be recreated
    # (another image swap, say), dump it first:
    #   docker exec jpv-pv-postgres pg_dump -U postgres joiabagur_pv > backup.sql
    #
    # Do NOT create schema `ai` or run CREATE EXTENSION here: that is the one-off
    # ai-service/migrations/bootstrap.sql, run once with admin privileges.
    image: pgvector/pgvector:pg15
    container_name: jpv-pv-postgres
    environment:
      POSTGRES_DB: joiabagur_pv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - jpv-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jpv-pv-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@joiabagur.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - jpv-network

  jbg-ai:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
      # C39a. The knowledge corpus lives at `<repo root>/data/knowledge`, outside the
      # context above, so the Dockerfile reaches it through a NAMED ADDITIONAL CONTEXT.
      # This line is not optional: with the `COPY --from=corpus` declared in the
      # Dockerfile, a build without it fails. The context itself stays `../ai-service`
      # precisely so that this file keeps working — moving it to the repository root was
      # the first plan and would have broken local development.
      #
      # Local development GAINS something here: until now this image carried no corpus
      # either, so `sync-knowledge` had nothing to index in a local container.
      additional_contexts:
        corpus: ../data/knowledge
    container_name: jpv-pv-jbg-ai
    # Secrets for local CLIs live in `.env` (copy `.env.example`). Compose
    # reads that file for ${VAR} interpolation automatically. Do NOT add
    # `env_file: .env` here: it would inject JPV_CATALOG_LLM_* (C06b generate,
    # host-only) into this runtime process. C09 will pass JPV_RAG_LLM_*
    # explicitly, one variable at a time. Production: SSM /jpv/prod/* (C17).
    environment:
      APP_ENV: local
      SERVICE_VERSION: 0.1.0
      LOG_LEVEL: INFO
      # Local development placeholder only. Production reads it from SSM (C17)
      # and shares the same value with the .NET API, which signs the token.
      JWT_SECRET: local-dev-jwt-secret-0123456789abcdef
      STUB_MODE: "true"
      # Resolves `postgres` by network name on the INTERNAL port 5432, not the
      # 5433 published to the host. No depends_on: the engine is built on first
      # use, and under STUB_MODE nothing asks for a session — so the container
      # starts fine even against a database nobody has provisioned yet.
      # Provisioning is the one-off `ai-service/migrations/bootstrap.sql`.
      DATABASE_URL: postgresql+psycopg://jbg_ai:local-dev-ai-password@postgres:5432/joiabagur_pv
      # C13 catalog feed. Backend is not a Compose service (`dotnet run` on :5056).
      # host.docker.internal needs extra_hosts on Linux; Docker Desktop already
      # provides it. Placeholder is IndexFeed:ApiKey, never JWT_SECRET.
      JPV_INDEX_FEED_BASE_URL: http://host.docker.internal:5056
      JPV_INDEX_FEED_API_KEY: local-dev-index-feed-key-0123456789ab
      JPV_INDEX_SYNC_TIME_BUDGET_SECONDS: "180"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"
    networks:
      - jpv-network

volumes:
  # Explicit `name`, so the volume is `jpv-pv-postgres-data` rather than the
  # `<directory>_postgres_data` Compose derives from the folder. Two reasons:
  #   1. Docker Desktop lists the volumes of every project side by side, and a
  #      name taken from the folder ("backend_postgres_data") says nothing about
  #      which project owns it.
  #   2. It pairs with container_name `jpv-pv-postgres`, so the two land together
  #      in any alphabetically sorted listing.
  # Renaming does NOT migrate anything: Compose creates a new empty volume and
  # leaves the previous one orphaned until someone removes it by hand.
  postgres_data:
    name: jpv-pv-postgres-data

networks:
  jpv-network:
    driver: bridge
