schema: spec-driven

context: |
  Jewelry POS management system — multi-location inventory, sales, AI image recognition.
  Target: 2-3 concurrent users, ~1.200 products (436 real + 764 synthetic), free-tier cloud (AWS).

  Backend: .NET 10, ASP.NET Core Web API, C#, EF Core, PostgreSQL 15+, JWT auth, Serilog.
  API docs: Scalar (not Swagger). Excel: ClosedXML. Passwords: BCrypt.Net.
  Layered monolith: Domain → Infrastructure → Application → API.
  Testing: xUnit, Moq, FluentAssertions, Bogus, Testcontainers.

  Frontend: React 19, TypeScript (strict), Vite, Metronic React (Layout 8 sidebar).
  UI: Radix UI + Tailwind CSS + Lucide icons. Forms: React Hook Form + Zod.
  Tables: TanStack Table. Routing: React Router v7. Toasts: Sonner. Theme: next-themes.
  Testing: Vitest, React Testing Library, MSW, Playwright.
  ML: TensorFlow.js client-side inference (MobileNetV2 transfer learning).

  AI service: jbg-ai — Python 3.11, FastAPI, uv, pydantic-settings (ai-service/).
  Persistence: SQLAlchemy 2 + psycopg 3 + Alembic; schema `ai` only, pool capped at 5.
  Testing: pytest + FastAPI TestClient; test tree mirrors src/jbg_ai (see ai-service/tests/README.md).
  Runtime enrichment (C09) uses LiteLLM and JPV_RAG_LLM_*; embeddings (C11) use the same LiteLLM pin and JPV_EMBEDDING_*. Catalog index sync (C13) uses JPV_INDEX_FEED_* (optional at boot; real POST /v1/index/sync requires them). Vector retrieval (C14) uses JPV_RETRIEVAL_DISTANCE_THRESHOLD (default 0.65, optional at boot) on POST /v1/retrieval/products when STUB_MODE=false. Query expansion (C20) uses JPV_QUERY_EXPANSION_ENABLED (default true, optional at boot) for the synonym dictionary that feeds the lexical branch; the setting supplies only the default and the effective value travels as a parameter of the orchestration call, so the frozen request schema does not move. Hybrid fusion (C21) consumes that expansion and adds JPV_RRF_K (60) and JPV_BRANCH_DEPTH (60). Ranking recalibration (C25) recomposes that fusion in two stages, and C25bis retired the single-stage one along with the per-list weights JPV_RRF_WEIGHT_TYPED, JPV_RRF_WEIGHT_EXPANDED and JPV_RRF_WEIGHT_VECTOR and the selector JPV_FUSION_MODE: there is one composition, the lexical branch's internal split is an equal constant rather than a setting, and a deployment that still exports any of the four has no effect. What a run actually composed is read from its recorded provenance and never from the environment. The fusion knobs that remain are JPV_BRANCH_WEIGHT_LEXICAL (0.5) and JPV_BRANCH_WEIGHT_VECTOR (0.5) — only their ratio changes the order, so the sweep is one-dimensional — plus JPV_BUSINESS_WEIGHT_AVAILABILITY (1.0, a declared unit whose sign was calibrated; its MAGNITUDE is irrelevant only inside C25's lexicographic key, and not inside C26's, where the same 1.0 spans the whole similarity range and partitions in practice — accepted and declared in that capability's spec rather than re-fixed, since the golden set carries no point-of-sale scope to calibrate it with; zero is the rollback). Substitutes (C26) add JPV_SUBSTITUTE_WEIGHT_SIZE (0.05, fixed by a sweep and not by the design) for the size-mismatch term of POST /v1/retrieval/substitutes; zero is the rollback and reproduces exactly the ordering the remaining terms produce alone and the abstention rule JPV_ABSTENTION_ENABLED (true), JPV_ABSTENTION_BAND_ALPHA (0.03) and JPV_ABSTENTION_BAND_MIN_CANDIDATES (15). Sale-argument generation (C30b) on POST /v1/assist/sale adds JPV_ASSIST_LLM_API_KEY, JPV_ASSIST_LLM_MODEL (openai/gpt-4o-mini) and JPV_ASSIST_PITCH_TIMEOUT_SECONDS (4, per CALL with a ceiling of two calls per request). The key falls back to JPV_RAG_LLM_API_KEY and which one won is logged once per process; the model NEVER inherits JPV_RAG_LLM_MODEL, which is C09's enrichment model, because inheriting it would move a counter-side model whose cost and rejection rate were measured on another. With neither key the route serves C30a's structured response with 200 and no prose, which is both the ablation and the rollback. All three are pinned in canonical_openapi_settings() so an exported value cannot leak into the committed snapshot. The intent router (C31) adds JPV_ROUTER_LLM_API_KEY, JPV_ROUTER_LLM_MODEL (openai/gpt-4o) and JPV_ROUTER_TIMEOUT_SECONDS (2, declared NOT calibrated), pinned the same way. The key falls back router -> assist -> rag and which link won is logged once per process as stage=router_client; the model NEVER inherits either of the other two, because a ~30-output-token classification and a paragraph are not the same call and sharing a variable would make any cost comparison false. Its default was MOVED BY MEASUREMENT: over the 119 cases of evals/routing/cases.yaml with the same prompt, gpt-4o-mini silenced 3 answerable queries (false positive 6,25 %) and the veto of D12 rejected it, while gpt-4o silenced 0 (false positive 0,00 %, catalog 48/48) and passed — so a deployment pointing JPV_ROUTER_LLM_MODEL at gpt-4o-mini is serving a configuration the veto rejected. With no key at all the classifier is not constructed, intent returns unclassified and the route serves exactly C30b's response, which is the fail-open, the ablation and the rollback at once. All optional at boot and all supplying only defaults for the same reason. The sale assistant's tool registry (C32a) adds NO setting and NO credential of any kind: it is a library wired to no route, its ports are injected, and by construction it calls no chat provider — which is what makes the half measurable at zero cost. Its six read-only tools are a frozen name set, its failures travel as observations with a closed cause code rather than as exceptions, and the read-only invariant is verified by INTROSPECTION of the constructed registry rather than by a declared flag. consultar_disponibilidad is served from ai.pos_projection and never from .NET — the .NET point lookup is identified, bounded and NOT built, recorded in openspec/DEFERRED_TASKS.md — and it emits a qualitative label (sin_existencias | ultimas_unidades | disponible) with a FOURTH value sin_ambito for a principal with no point of sale or a piece with no projection row, because the projection's QTY_BUCKETS are numerals and absence of a row is not a count of zero. The agent loop (C32b) consumes that registry on a route of its own, POST /v1/assist/agent, and adds JPV_AGENT_LLM_API_KEY, JPV_AGENT_LLM_MODEL (openai/gpt-4o) and JPV_AGENT_TIMEOUT_SECONDS (8, per TURN and never per request), pinned in canonical_openapi_settings() like the rest. The key falls back agent -> assist -> rag and which link won is logged once per process as stage=agent_client; the classifier's key is deliberately NOT a link, because one request of this route resolves two clients and letting one fall back to the other would make the cost of the two stages impossible to tell apart. With no key the loop is not constructed and the route answers 200 without running it, which is the fail-open, the ablation and the rollback at once. The model NEVER inherits the argument's nor the classifier's, and it is the cheapest cost lever the capability has. Its SIX budgets are NOT settings but constants of assist/constants.py, because the provider-call ceiling is DERIVED from them and a deployment able to move them could break an invariant the suite asserts; they travel by parameter so an evaluation can sweep them in one process. Three of the six were fixed BY MEASUREMENT in run 293fe5c6e470 (204 requests, two model arms): tokens 40.000 (p95 16.244 of classifier plus loop, which is what the budget compares), context 30.000 characters (p95 4.709) and a wall-clock deadline of 15 s (p95 9,0 s) for the WHOLE request, which TIGHTENS the 20 s the design had declared: the loop runs against 15 s minus the argument's reserve (MAX_PITCH_PROVIDER_CALLS x the argument timeout, 8 s by default) and the turn in flight is cut when that runs out. The tool-call ceiling moved from 6 to 8 after the same run measured p95 5 with 3,9 % of requests truncated. The same run answered Q-7 in the negative: gpt-4o-mini costs x1,1 against the deterministic pipeline instead of x3,0, each stage priced by its own model (the classifier runs gpt-4o on both routes, 0,0084 USD a request), but exhausts a budget in 66 % of requests against 1,2 %, so the model multiplier is reversible in price and NOT in behaviour. Every aggregate of the run is recomputable with python -m jbg_ai.evals.agent_sweep --rescore, with no provider and no database. POST /v1/assist/sale is unchanged field for field and ceiling for ceiling, which is what keeps the two routes comparable over the same set. The scheduled POS drain (C41) adds JPV_POS_SYNC_SCHEDULER_ENABLED (true) and JPV_POS_SYNC_INTERVAL_SECONDS (600), neither pinned in canonical_openapi_settings() because neither reaches the contract. The interval is DERIVED from the staleness ceiling rather than chosen: at the 3600 s default of JPV_POS_PROJECTION_MAX_AGE_SECONDS the rule is ceiling / interval >= 4, so 600 s tolerates five consecutive failed drains before the guard degrades the scope. The drain runs ONCE AT START-UP -- in full when no checkpoint exists, which is what cures a freshly deployed environment -- and then on the interval, reusing the same drain the CLI invokes rather than reimplementing the keyset protocol. Every drain takes a NON-BLOCKING advisory lock INSIDE the drain itself rather than inside the scheduler, so that a scheduled tick and a `sync-pos` run by hand decline and write nothing instead of interleaving the single-row keyset of ai.sync_checkpoint -- an interleaved keyset does not fail, it skips rows in silence. It does not start under STUB_MODE nor without a configured feed, and it NEVER blocks start-up: the task is created and not awaited, because the container health probe has a three-second timeout and the composition chains service start-up on it. GET /health gains a `projection` section read from ai.sync_checkpoint.last_incremental_sync_at and NEVER from ai.pos_projection.refreshed_at, carrying the age, the ceiling, the staleness verdict, the pages recorded as failed and the points of sale holding no assortment; it reaches the administrator card through GET /api/ai/health, and deploy/demo/verify.sh gains a fifth failure condition for an empty projection. NO route under /v1, openapi.json unchanged, and no migration. Catalog generate (C06b) uses the OpenAI SDK and JPV_CATALOG_LLM_*. None of those keys is required to boot /health.
  DB tests use testcontainers with pgvector and skip when Docker is unreachable.
  Separate container; Python does vector search and LLM only, .NET owns all business
  logic and is the final authority on price, stock and permissions. Browser never
  calls Python: .NET → jbg-ai over an internal HS256 service JWT on the Docker network.

  C34 gives the sale card its .NET routes: POST /api/ai/products/{id}/sales-assist
  (question in the body) and GET /api/ai/products/{id}/substitutes, both checking that
  the point of sale carries the product BEFORE calling jbg-ai. .NET hydrates the group,
  computes the stock warnings and resolves {{price}}/{{stock}} against the anchored
  product; an unresolved placeholder withholds the argument, never the response
  (pitchStatus has six values, substitutes an outcome of four). The gateway's generative
  client `ai-assist` has a 10 s budget, an 8 s floor validated at start-up, its own
  circuit and no retry on timeout. Both of the other assist routes got their .NET consumer
  later: the free query in C40 (POST /api/ai/search/assisted) and the agent in C42
  (POST /api/ai/search/agent). The agent's gateway client is `ai-agent`, a fourth route
  family with a circuit of its own, an 18 s budget and a 15 s floor validated at start-up
  because 15 s is the service's own wall-clock deadline (AGENT_DEADLINE_SECONDS); AssistTimeoutMs
  is untouched. That breaker deliberately does NOT count an in-band degradation: Polly sees a
  transport outcome and not the body, so a 200 carrying stop_reason=fallo_proveedor or sin_cliente
  is a success at that layer and is instrumented as a metric instead.

  C17 enriched GET /health without moving the frozen contract: it also reports database
  reachability, indexed document count, whether the embedding provider credential is
  configured, and a contrast of the configured embedding model against the one recorded on
  the index rows — never calling the provider, and cached for a short window because the
  connection pool is capped at 5. Its return annotation stays an open mapping, so
  openapi.json is unchanged. The browser cannot query jbg-ai directly, so the administrator
  dashboard card is served by GET /api/ai/health on the .NET side: administrators only, and
  on an HTTP client with no circuit breaker, because its job is to diagnose the system
  precisely when the main path is failing.

  C17 also deploys an isolated demonstration environment in a SEPARATE AWS account:
  terraform/demo/ with its own state, compose.demo.yaml with four services where only the
  Caddy proxy publishes ports, secrets read from the parameter store into the deploying
  process environment and never to disk, and post-deployment verification executed inside
  the host because the AI service is private by design. Runbook: deploy/demo/README.md.
  Two vector indexes live in schema `ai` (pgvector) of the same PostgreSQL database:
  ai.product_document for products (C13) and ai.knowledge_chunk for the commercial
  knowledge corpus (C23). They are never fused: a product is ranked and hydrated,
  a knowledge fragment is cited, and their scores are not comparable.

  Infra: Docker Compose (dev), AWS EC2 + Docker + nginx (TLS via Let's Encrypt),
  RDS PostgreSQL, S3 prod-jpv-files, ECR, SSM Parameter Store /jpv/prod/*,
  GitHub OIDC for deploy (prod). Defined in terraform/. The App Runner + CloudFront
  workflows are deprecated and manual-only.
  Storage: IFileStorageService abstraction (local dev, S3 prod).

  Roles: Admin (full access), Operator (restricted to assigned POS).
  Currency: EUR (€), locale es-ES. UI language: Spanish. Technical docs: English.

  Key constraints:
  - Max 5-10 DB connections (connection pooling).
  - Mandatory pagination on operator lists (max 50 items/page). Index feeds: catalog 50, POS 200.
  - Frontend bundle < 500KB initial load.
  - Stock cannot be negative (application-level validation).
  - Sale.Price is a snapshot, not a reference to current product price.
  - Manual price override only when POS.AllowManualPriceEdit = true, audited.
  - Cart checkout is atomic (all-or-nothing) with idempotency key; all lines same POS + payment method.
  - Returns: same POS as sale, 30-day window, mandatory category, multi-sale supported.
  - Inventory.IsActive determines product assignment to POS (not just quantity).
  - Prefer Metronic UI components over custom implementations.
  - Backend naming: Microsoft C# conventions, async/await for I/O, Repository + Service patterns.
  - Frontend naming: functional components, hooks, colocated tests.

  Epics (MVP): EP1-Products, EP2-Inventory, EP3-Sales, EP4-AI Recognition, EP5-Returns,
  EP6-Payment Methods, EP7-Auth/Users, EP8-POS, EP9-Reports, EP10-Jewelry Components.

  Epics (AI final project): EP11-AI Service Platform, EP12-Catalog Corpus & Enrichment,
  EP13-Product Families, EP14-Hybrid Semantic Search, EP15-Assisted Sales & Agents,
  EP16-Assisted Inventory & Demand Signals, EP17-AI Evaluation & Observability.
  Their user stories use a flat HU-AIENG-[NNN] series under Documentos/Historias/AI-Eng/,
  organised by OpenSpec change (C01-C39), not per epic.

  Reference docs: Documentos/epicas.md, Documentos/modelo-de-datos.md,
  Documentos/arquitectura.md, Documentos/Guias/*.md, Documentos/Historias/*.md.

rules:
  proposal:
    - Proposals must not contain code — only design documents (proposal.md, tasks.md, design.md, spec deltas).
    - Check Documentos/epicas.md for existing user stories before proposing new ones.
    - Reference the data model in Documentos/modelo-de-datos.md for entity/field decisions.
  specs:
    - Use Given/When/Then format for all scenarios.
    - Reference existing spec patterns in openspec/specs/ before inventing new ones.
    - Spec requirements must be verifiable (no vague qualifiers like "fast" or "user-friendly").
  design:
    - Include sequence diagrams for flows spanning multiple layers or services.
    - Document trade-offs explicitly when multiple approaches exist.
  tasks:
    - Each task must be completable in a single AI coding session.
    - Include validation step (test, build, manual check) in every task.
    - After completing tasks, update affected docs in Documentos/ (epicas.md, modelo-de-datos.md, Historias/, Guias/).
    - "Backend test naming: Method_Scenario_ExpectedResult. Frontend: should [behavior] when [condition]."
